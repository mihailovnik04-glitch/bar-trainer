<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#17140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Бар · тренажёр граммовок</title>
<style>
:root{
  --bg:#0F0D0B; --card:#191612; --card-2:#211D18; --line:#2C2721;
  --ink:#F6F2EA; --ink-2:#A79C8C; --ink-3:#6E655A;
  --acc:#E0A45B; --ok:#4FB477; --bad:#E2564B;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.4;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 28px;min-height:100%;display:flex;flex-direction:column}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:34px}
.top .back{width:34px;height:34px;border-radius:11px;background:var(--card);display:grid;place-items:center;
  font-size:18px;color:var(--ink-2);transition:.18s}
.top .back:active{transform:scale(.92)}
.bar{flex:1;height:6px;border-radius:6px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.hearts{display:flex;gap:4px;font-size:13px;letter-spacing:1px}
.timer{font-family:var(--mono);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--bad)}
.count{font-family:var(--mono);font-size:13px;color:var(--ink-3)}

/* ---------- главный экран ---------- */
h1{font-size:27px;line-height:1.1;letter-spacing:-.5px;margin:8px 0 6px;font-weight:800}
.lead{color:var(--ink-2);font-size:14.5px;margin:0 0 20px}
.mode{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:18px;
  margin-bottom:12px;border:1px solid var(--line);transition:transform .16s,border-color .2s}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:18px;margin-bottom:4px}
.mode span{display:block;color:var(--ink-2);font-size:13.5px}
.mode .tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.mode .tags i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--acc);
  background:#E0A45B1a;border-radius:8px;padding:4px 8px}
.mode.ghost{background:transparent;border-style:dashed}
.mode.ghost b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 18px}
.stats div{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:19px;color:var(--acc)}
.stats span{font-size:11px;color:var(--ink-3);letter-spacing:.02em}

/* ---------- карточка вопроса ---------- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center}
.q{background:var(--card);border-radius:22px;padding:20px;border:1px solid var(--line);
  animation:in .26s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
.q.shake{animation:shake .35s}
.q .drink{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q .drink img{width:52px;height:52px;border-radius:13px;object-fit:cover;background:var(--card-2);flex:0 0 52px}
.q .drink div{min-width:0}
.q .drink b{display:block;font-size:16px;line-height:1.2}
.q .drink span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.q h2{font-size:21px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-.3px}
.q .hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* таблица пака «пропущенная граммовка» */
.fillt{width:100%;border-collapse:collapse;margin-top:14px}
.fillt td{padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.fillt td+td{text-align:right;font-family:var(--mono);color:var(--ink);white-space:nowrap;padding-left:10px}
.fillt tr.miss td{color:var(--acc)}
.fillt tr.miss td+td{color:var(--acc);font-weight:700}
.fillt tr.tot td{border-bottom:0;color:var(--ink-3);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.fillt tr.tot td+td{color:var(--ink-2);text-transform:none;letter-spacing:0}
/* ввод числа */
.numrow{display:flex;align-items:center;gap:10px;margin-top:18px}
.numrow input{flex:1;width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:15px;
  padding:14px 16px;font-family:var(--mono);font-size:24px;color:var(--ink);outline:none;
  transition:border-color .2s,background .2s;-moz-appearance:textfield}
.numrow input::-webkit-outer-spin-button,.numrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numrow input:focus{border-color:var(--acc)}
.numrow .unit{font-family:var(--mono);font-size:16px;color:var(--ink-3);min-width:26px}
.go{background:var(--acc);color:#17140F;border-radius:15px;padding:14px 20px;font-weight:700;font-size:16px;
  transition:transform .15s,opacity .2s}
.go:active{transform:scale(.95)}
.go.wide{width:100%;margin-top:14px;text-align:center}

/* варианты */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{background:var(--card-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;
  font-size:16px;transition:transform .14s,background .2s,border-color .2s}
.opt:active{transform:scale(.985)}
.opt.num{font-family:var(--mono);font-size:18px}
.opt.ok{border-color:var(--ok);background:#4FB4771f}
.opt.bad{border-color:var(--bad);background:#E2564B1f}
.opt.dim{opacity:.45}

/* фидбек */
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px;display:none;
  animation:in .2s ease-out}
.fb.show{display:block}
.fb.ok{background:#4FB4771f;color:#9EE0B8}
.fb.bad{background:#E2564B1f;color:#F3A8A2}
.fb b{font-family:var(--mono)}
.pill{display:inline-block;font-family:var(--mono);background:#0003;border-radius:8px;padding:2px 7px;margin-left:4px}

/* результат */
.res{text-align:center;padding:10px 0}
.res .big{font-family:var(--mono);font-size:54px;font-weight:700;letter-spacing:-2px;line-height:1}
.res .big.win{color:var(--ok)}.res .big.lose{color:var(--bad)}
.res p{color:var(--ink-2);font-size:14.5px}

/* список ошибок */
.list{margin-top:6px}
.item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);
  display:flex;gap:12px;align-items:center;animation:in .2s ease-out}
.item img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:0 0 40px;background:var(--card-2)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.item .txt span{font-size:12px;color:var(--ink-3)}
.item .ans{font-family:var(--mono);font-size:14px;color:var(--ok);white-space:nowrap}
.item .cnt{font-family:var(--mono);font-size:11px;color:var(--bad)}
.empty{text-align:center;color:var(--ink-3);padding:40px 10px;font-size:14.5px}
.hidden{display:none!important}
.row{display:flex;gap:8px;margin-top:14px}
.row .go{flex:1}
.ghostbtn{border:1px solid var(--line);border-radius:15px;padding:14px 18px;color:var(--ink-2);flex:1;text-align:center;
  transition:transform .15s}
.ghostbtn:active{transform:scale(.96)}

/* ---------- модалка с рецептом ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:#000000a6;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.sheet-card{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);
  border-radius:24px 24px 0 0;padding:0 0 26px;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.85,.25,1);-webkit-overflow-scrolling:touch}
.modal.on .sheet-card{transform:none}
/* Шапка карточки липкая и всегда держит кнопку возврата: одной «шторки» мало —
   с телефона было непонятно, как выйти обратно в справочник. */
.sheet-card .grip{position:sticky;top:0;background:var(--card);
  padding:10px 14px 8px;display:flex;align-items:center;gap:10px;z-index:2;
  border-bottom:1px solid var(--line)}
.sheet-card .grip i{width:42px;height:4px;border-radius:4px;background:var(--line);display:block;
  position:absolute;left:50%;transform:translateX(-50%);top:6px}
.sheet-card .grip .cls{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);
  background:var(--card-2);border-radius:11px;padding:8px 13px 8px 9px;transition:transform .15s}
.sheet-card .grip .cls:active{transform:scale(.94)}
.sheet-card .grip .cls b{font-size:17px;font-weight:400;line-height:1}
.rc{padding:0 18px}
.rc .hero{width:100%;height:210px;object-fit:contain;border-radius:16px;background:var(--card-2);display:block;padding:6px}
.rc h3{font-size:23px;margin:14px 0 8px;letter-spacing:-.4px;line-height:1.15}
.rc .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rc .chips span{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  background:var(--card-2);border-radius:9px;padding:5px 9px}
.rc .chips span.a{background:#E0A45B1f;color:var(--acc)}
.rc .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 7px}
.rc table{width:100%;border-collapse:collapse}
.rc td{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:baseline}
.rc td.a{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap;padding-left:10px}
.rc tr.g td{color:var(--ink-2)} .rc tr.g td.a{color:var(--acc)}
.rc .method{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.rc .method b{color:var(--ink)}
.rc .formula{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:var(--card-2);
  border-radius:12px;padding:11px 13px;color:var(--ink-2);margin-top:14px}
.rc .keyb{background:#E0A45B14;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.45}
.rc .keyb b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.rc .var{border:1px dashed var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
.rc .var b{display:block;font-size:14px;margin-bottom:4px}
.rc .var p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45}
.rc .serve{font-size:13px;color:var(--ink-3);font-style:italic;margin-top:8px}

/* ---------- справочник ---------- */
/* шапка экрана: заголовок и возврат на главную (у quiz своя шапка #top) */
.scrhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.scrhead h1{font-size:23px;margin:0}
.scrhead .back{width:34px;height:34px;border-radius:11px;background:var(--card);display:grid;
  place-items:center;font-size:20px;color:var(--ink-2);flex:0 0 34px;transition:.18s}
.scrhead .back:active{transform:scale(.92)}

/* переключатель порядка: по главам пособия или как в исходной таблице */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:4px;margin-bottom:14px}
.seg button{flex:1;border-radius:10px;padding:9px 6px;font-size:13.5px;color:var(--ink-2);
  transition:background .18s,color .18s}
.seg button.on{background:var(--card-2);color:var(--ink);font-weight:600}

.search{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;color:var(--ink);font-size:16px;outline:none;margin-bottom:14px;transition:border-color .2s}
.search:focus{border-color:var(--acc)}
.chgroup{margin:18px 0 8px;display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.chgroup i{width:8px;height:8px;border-radius:50%;display:block}
/* Строка справочника показывает состав сразу: на телефоне открывать каждую карточку,
   чтобы увидеть граммовки, слишком долго. Шапка строки — flex, состав под ней — сетка
   «название / количество», числа моноширинным и всегда прижаты вправо. */
.rrow{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;margin-bottom:7px;width:100%;text-align:left;transition:transform .14s}
.rrow:active{transform:scale(.985)}
.rrow .h{display:flex;align-items:center;gap:12px}
.rrow img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:var(--card-2);flex:0 0 38px}
.rrow .t{flex:1;min-width:0}
.rrow .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.rrow .t span{font-size:11.5px;color:var(--ink-3)}
.rrow .v{font-family:var(--mono);font-size:12.5px;color:var(--acc);white-space:nowrap}
.rrow .comp{display:grid;grid-template-columns:1fr auto;gap:1px 10px;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--line)}
.rrow .comp dt{font-size:12.5px;color:var(--ink-2);line-height:1.5;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .comp dd{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);
  line-height:1.5;white-space:nowrap;text-align:right}
.rrow .comp .g dt,.rrow .comp dt.g{color:var(--ink-3)}
.rrow .comp dd.g{color:var(--acc)}
details.cheatbox{margin-bottom:10px}
details.cheatbox>summary{list-style:none;cursor:pointer;background:var(--card);border:1px dashed var(--line);
  border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
details.cheatbox>summary::-webkit-details-marker{display:none}
details.cheatbox>summary::after{content:'＋';float:right;color:var(--ink-3)}
details.cheatbox[open]>summary{color:var(--ink);margin-bottom:8px}
details.cheatbox[open]>summary::after{content:'−'}
details.cheat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
details.cheat summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.cheat summary::-webkit-details-marker{display:none}
details.cheat summary::after{content:'＋';float:right;color:var(--ink-3);font-weight:400}
details.cheat[open] summary::after{content:'−'}
details.cheat .in{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
details.cheat table{width:100%;border-collapse:collapse;font-size:13px}
details.cheat td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
details.cheat td+td{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:10px}
details.cheat b{color:var(--ink)}
.fbbtn{margin-top:9px;display:inline-block;background:#0004;border-radius:10px;padding:7px 12px;
  font-size:13px;color:var(--ink);border:1px solid var(--line)}
.foot{margin-top:auto;padding-top:22px;text-align:center;color:var(--ink-3);font-size:11.5px}
@media (min-width:620px){ .wrap{padding-top:36px} h1{font-size:32px} }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="wrap">
  <div class="top hidden" id="top">
    <button class="back" id="back">‹</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>
    <div class="hearts" id="hearts"></div>
    <div class="timer" id="timer"></div>
  </div>

  <!-- ГЛАВНАЯ -->
  <div id="home">
    <h1>Тренажёр<br>граммовок</h1>
    <p class="lead">Составы, украшения и посуда из барного пособия. Только цифры и факты — ничего лишнего.</p>
    <div class="stats">
      <div><b id="stTotal">0</b><span>ПОПЫТОК</span></div>
      <div><b id="stBest">—</b><span>ЛУЧШИЙ РЕЗУЛЬТАТ</span></div>
      <div><b id="stAcc">—</b><span>ТОЧНОСТЬ</span></div>
    </div>
    <button class="mode" data-mode="exam">
      <b>Экзамен</b>
      <span>75 вопросов, три ошибки — и стоп. Порядок случайный, время ограничено.</span>
      <div class="tags"><i>75 вопросов</i><i>30:00</i><i>3 ошибки</i></div>
    </button>
    <button class="mode" data-mode="train">
      <b>Тренировка</b>
      <span>Все вопросы банка подряд в случайном порядке. Без таймера и лимита ошибок.</span>
      <div class="tags"><i id="bankSize">0 вопросов</i><i>без лимита</i></div>
    </button>
    <button class="mode" data-mode="ref">
      <b>Справочник</b>
      <span>Все карточки коктейлей целиком: состав, украшения, приготовление, ключ к запоминанию. И шпаргалки по системе.</span>
      <div class="tags"><i id="refSize">0 рецептов</i><i>поиск по ингредиенту</i></div>
    </button>
    <button class="mode ghost" data-mode="errors">
      <b>Мои ошибки <span style="display:inline;color:var(--bad)" id="errCount"></span></b>
      <span>Разбор и повторное решение того, что не получилось.</span>
    </button>
    <div class="foot">Работает без интернета · данные хранятся только в этом браузере</div>
  </div>

  <!-- ТЕСТ -->
  <div id="quiz" class="stage hidden"></div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="result" class="hidden"></div>

  <!-- СПРАВОЧНИК -->
  <div id="ref" class="hidden">
    <div class="scrhead"><button class="back" data-home="1">‹</button><h1>Справочник</h1></div>
    <input class="search" id="refQ" placeholder="Коктейль или ингредиент…" autocomplete="off">
    <div class="seg" id="refSort">
      <button data-sort="ch" class="on">По системе</button>
      <button data-sort="src">Как в таблице</button>
    </div>
    <div id="cheats"></div>
    <div id="refList"></div>
  </div>

  <!-- ОШИБКИ -->
  <div id="errors" class="hidden">
    <div class="scrhead"><button class="back" data-home="1">‹</button><h1>Мои ошибки</h1></div>
    <p class="lead" id="errLead"></p>
    <div class="row" id="errActions"></div>
    <div class="list" id="errList"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet-card" id="sheetCard"></div></div>

<script src="media.js"></script>
<script src="recipes.js"></script>
<script src="bank.js"></script>
<script>
const BANK = window.BANK;
BANK.forEach((q,i)=>q.i=i);
const IMG = window.IMG || {};                 // ключ -> data-URI, картинка хранится один раз
const REC = (window.RECIPES||{recipes:[],chapters:[]});
const src = k => IMG[k] || '';
const $ = s=>document.querySelector(s);
const EX_N = 75, EX_LIVES = 3, EX_SEC = 30*60;

/* ---------- хранилище ----------
   v2: ошибки хранятся по стабильному q.id (хеш от напитка и текста вопроса), а не по
   позиции в BANK — позиция меняется при каждой перегенерации банка, и ошибки съезжали
   на чужие вопросы. Данные из v1 переносим один раз: там ключ — старый индекс. */
const KEY='barquiz.v2', KEY_OLD='barquiz.v1';
const BY_ID = {}; BANK.forEach(q=>BY_ID[q.id]=q);
let store = {errors:{}, stats:{runs:0, best:0, right:0, total:0}};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){ store=Object.assign(store, JSON.parse(raw)); }
  else{
    const old=localStorage.getItem(KEY_OLD);
    if(old){
      const o=JSON.parse(old);
      store.stats=Object.assign(store.stats, o.stats||{});
      for(const [i,n] of Object.entries(o.errors||{})){
        const q=BANK[+i]; if(q) store.errors[q.id]=n;   // индекс -> id по текущему банку
      }
      localStorage.setItem(KEY, JSON.stringify(store));
    }
  }
}catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} };
let REF_SORT = store.refSort==='src' ? 'src' : 'ch';   // порядок справочника: главы или таблица

/* ---------- утилиты ---------- */
const fmt = v => Number.isInteger(v) ? String(v) : String(v).replace('.',',');
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]];} return a; };
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const answerText = q => (q.t==='num'||q.t==='fill') ? `${fmt(q.a)} ${q.unit}` : q.opts[q.ai];
const qLabel = q => q.q.replace(/^Сколько\s+/,'').replace(/^весит:\s*/,'Вес: ')
   .replace(/\?$/,'').replace(/ идёт в украшение/,' · украшение')
   .replace(/^В какой посуде.*$/,'Посуда').replace(/^Чем украшается.*$/,'Набор украшений');

function pickExam(){
  const isNum = q => q.t==='num'||q.t==='fill';
  const by = c => BANK.filter(q=>q.cat===c && isNum(q));
  const byc = c => BANK.filter(q=>q.cat===c && !isNum(q));
  const take = (arr,n) => shuffle(arr.slice()).slice(0,n);
  const set = [
    ...take(by('grams'), 48),
    ...take(byc('grams'), 7),
    ...take(by('garnish'), 12),
    ...take(byc('garnish'), 5),
    ...take(BANK.filter(q=>q.cat==='glass'), 3)
  ];
  return shuffle(set).slice(0, EX_N);
}

/* ---------- состояние ---------- */
let S = null, tick = null;

function show(id){
  ['home','quiz','result','errors','ref'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==id));
  closeRecipe();
  $('#top').classList.toggle('hidden', id!=='quiz');
}

function renderHome(){
  const st=store.stats;
  $('#stTotal').textContent = st.runs;
  $('#stBest').textContent = st.best ? st.best+'/'+EX_N : '—';
  $('#stAcc').textContent = st.total ? Math.round(st.right/st.total*100)+'%' : '—';
  $('#bankSize').textContent = BANK.length+' вопросов';
  $('#refSize').textContent = REC.recipes.length+' рецептов';
  const n = Object.keys(store.errors).length;
  $('#errCount').textContent = n ? '· '+n : '';
  show('home');
}

/* ---------- запуск ---------- */
function start(mode){
  let list;
  if(mode==='exam') list = pickExam();
  else if(mode==='train') list = shuffle(BANK.slice());
  else list = shuffle(Object.keys(store.errors).map(id=>BY_ID[id]).filter(Boolean));
  if(!list.length){ renderHome(); return; }
  S = {mode, list, k:0, right:0, wrong:0, lives:EX_LIVES, left:EX_SEC, done:[], t0:Date.now()};
  show('quiz');
  if(mode==='exam'){
    $('#timer').textContent = mmss(S.left);
    clearInterval(tick);
    tick = setInterval(()=>{
      S.left--; $('#timer').textContent = mmss(S.left);
      $('#timer').classList.toggle('warn', S.left<=120);
      if(S.left<=0) finish('time');
    },1000);
  } else { $('#timer').textContent=''; clearInterval(tick); }
  renderQ();
}

function renderQ(){
  const q = S.list[S.k];
  $('#prog').style.width = (S.k/S.list.length*100)+'%';
  $('#count').textContent = (S.k+1)+'/'+S.list.length;
  $('#hearts').innerHTML = S.mode==='exam'
    ? '<span style="color:var(--bad)">'+'●'.repeat(S.lives)+'</span><span style="color:var(--ink-3)">'+'○'.repeat(EX_LIVES-S.lives)+'</span>'
    : '';
  const img = q.img ? `<img src="${src(q.img)}" alt="">` : '';
  // «Пропущенная граммовка»: показываем состав целиком, пустая строка — та, что нужно вписать.
  const fillTable = q.t==='fill'
    ? `<table class="fillt">${q.rows.map(([n,a])=>
         `<tr class="${a?'':'miss'}"><td>${n}</td><td>${a||'?'}</td></tr>`).join('')}
       <tr class="tot"><td>Выход</td><td>${q.total}</td></tr></table>` : '';
  const body = (q.t==='num'||q.t==='fill')
    ? `${fillTable}<div class="numrow">
         <input id="inp" type="number" inputmode="decimal" enterkeyhint="go" placeholder="0" autocomplete="off">
         <span class="unit">${q.unit}</span>
         <button class="go" id="ok">Ответ</button>
       </div>`
    : `<div class="opts">${q.opts.map((o,i)=>
         `<button class="opt ${q.cat!=='glass'&&q.t==='choice'&&/^\d/.test(o)?'num':''}" data-i="${i}">${o}</button>`).join('')}</div>`;
  $('#quiz').innerHTML = `<div class="q" id="qc">
      <div class="drink">${img}<div><span>${q.cat==='glass'?'посуда':(q.cat==='garnish'?'украшение':'состав')}</span><b>${q.drink}</b></div></div>
      <h2>${q.q}</h2>
      ${q.hint?`<div class="hint">${q.hint}</div>`:''}
      ${body}
      <div class="fb" id="fb"></div>
    </div>`;
  if(q.t==='num'||q.t==='fill'){
    const inp=$('#inp');
    setTimeout(()=>inp.focus({preventScroll:true}),60);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submitNum(); });
    $('#ok').addEventListener('click', submitNum);
  } else {
    $('#quiz').querySelectorAll('.opt').forEach(b=>
      b.addEventListener('click',()=>submitChoice(+b.dataset.i, b)));
  }
}

function submitNum(){
  const q=S.list[S.k], inp=$('#inp');
  if(inp.disabled) return;
  const raw=(inp.value||'').replace(',','.').trim();
  if(raw==='') { inp.focus(); return; }
  const ok = Math.abs(parseFloat(raw) - q.a) < 0.001;
  inp.disabled=true; $('#ok').style.opacity=.4;
  inp.style.borderColor = ok?'var(--ok)':'var(--bad)';
  grade(ok);
}

function submitChoice(i, btn){
  const q=S.list[S.k];
  const btns=$('#quiz').querySelectorAll('.opt');
  if(btns[0].disabled) return;
  btns.forEach((b,j)=>{ b.disabled=true;
    if(j===q.ai) b.classList.add('ok');
    else if(j===i) b.classList.add('bad');
    else b.classList.add('dim'); });
  grade(i===q.ai);
}

function grade(ok){
  const q=S.list[S.k], fb=$('#fb');
  S.done.push({i:q.i, ok});
  store.stats.total++; if(ok) store.stats.right++;
  if(ok){
    S.right++;
    if(store.errors[q.id]){ delete store.errors[q.id]; }
    fb.className='fb ok show'; fb.innerHTML='Верно';
  } else {
    S.wrong++; if(S.mode==='exam') S.lives--;
    store.errors[q.id] = (store.errors[q.id]||0)+1;
    fb.className='fb bad show';
    fb.innerHTML = 'Правильный ответ: <b>'+answerText(q)+'</b>'
      + '<span style="opacity:.55;font-size:12px"> · тап или Enter — дальше</span>'
      + (q.r!=null ? '<br><span class="fbbtn" id="showRec" data-r="'+q.r+'">Открыть рецепт целиком</span>' : '');
    $('#qc').classList.add('shake');
  }
  save();
  if(S.mode==='exam' && S.lives<=0){ setTimeout(()=>finish('lives'), 1200); return; }
  const delay = ok ? 420 : 1900;
  S.timer = setTimeout(next, delay);
  setTimeout(()=>{ if(!S.ended){ S.armed=true; document.addEventListener('pointerdown', onAdvance, {once:true}); } }, 220);
}

function onAdvance(e){
  // тап по кнопке рецепта или внутри модалки не листает вопрос
  if(e && e.target.closest && e.target.closest('#modal, #showRec')){
    document.addEventListener('pointerdown', onAdvance, {once:true});
    return;
  }
  if(S.armed) next();
}

function next(){
  if(S.ended) return;
  S.armed=false;
  document.removeEventListener('pointerdown', onAdvance);
  clearTimeout(S.timer);
  S.k++;
  if(S.k>=S.list.length) finish('end'); else renderQ();
}

function finish(why){
  if(S.ended) return; S.ended=true; S.armed=false;
  document.removeEventListener('pointerdown', onAdvance);
  clearInterval(tick); clearTimeout(S.timer);
  const secs = Math.round((Date.now()-S.t0)/1000);
  if(S.mode==='exam'){
    store.stats.runs++;
    if(S.right>store.stats.best) store.stats.best=S.right;
    save();
  }
  const passed = S.mode!=='exam' ? null : (why==='end' && S.lives>0);
  const title = S.mode==='exam'
      ? (passed ? 'Экзамен сдан' : (why==='time' ? 'Время вышло' : (why==='lives'?'Три ошибки':'Экзамен завершён')))
      : (S.mode==='train' ? 'Тренировка завершена' : 'Разбор ошибок завершён');
  const acc = S.done.length ? Math.round(S.right/S.done.length*100) : 0;
  const errN = Object.keys(store.errors).length;
  $('#result').innerHTML = `
    <div class="res">
      <div class="big ${passed===null? '' : (passed?'win':'lose')}">${S.right}<span style="font-size:22px;color:var(--ink-3)">/${S.mode==='exam'?EX_N:S.done.length}</span></div>
      <h1 style="font-size:22px;margin:12px 0 4px">${title}</h1>
      <p>Точность ${acc}% · время ${mmss(secs)} · ошибок ${S.wrong}</p>
    </div>
    <div class="row">
      <button class="go" id="again">Ещё раз</button>
      <button class="ghostbtn" id="toErr">Ошибки${errN?' · '+errN:''}</button>
    </div>
    <div class="row"><button class="ghostbtn" id="toHome">На главную</button></div>`;
  show('result');
  $('#again').onclick = ()=>start(S.mode);
  $('#toErr').onclick = openErrors;
  $('#toHome').onclick = renderHome;
}

/* ---------- карточка рецепта ---------- */
const mark = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')
  .replace(/(Взбить|взбить|Перемешать|перемешать|Отфильтровать|отфильтровать|Украсить|украсить|Прогреть|прогреть|Охладить|охладить|размять мадлером|слить талую воду|не варить|проварить|слоями|Стир)/g,'<b>$1</b>');

      r.gar.map(([n,a])=>`<tr class="g"><td>${n}</td><td class="a">${a}</td></tr>`).join('')+`</table>` : '';
  const vars = (r.var||[]).map(v=>`<div class="var"><b>${v.name}</b><p>${mark(v.method)}</p></div>`).join('');
  return `<div class="grip"><i></i>
      <button class="cls" id="clsRec"><b>‹</b>${BACK_LABEL}</button>
    </div><div class="rc">
    ${r.img?`<img class="hero" src="${src(r.img)}" alt="">`:''}
    <h3>${r.name}${r.total?` <span style="font-family:var(--mono);font-size:15px;color:var(--acc)">${r.total}</span>`:''}</h3>

    <div class="lbl">Состав</div><table>${rows}</table>
    ${gars}
    <div class="lbl">Приготовление</div><div class="method">${mark(r.method)}</div>
    ${r.serve?`<div class="serve">${r.serve}</div>`:''}
    ${r.formula?`<div class="formula">${r.formula}${r.total?' = '+r.total:''}</div>`:''}
    ${r.key?`<div class="keyb"><b>Ключ</b>${r.key}</div>`:''}
    ${vars}
  </div>`;
}

let BACK_LABEL = 'Назад';
function openRecipe(i){
  const r = REC.recipes[i]; if(!r) return;
  if(S){ clearTimeout(S.timer); }              // не листаем вопрос, пока читают рецепт
  BACK_LABEL = $('#ref').classList.contains('hidden') ? 'Назад' : 'Справочник';
  $('#sheetCard').innerHTML = recipeHTML(r);
  $('#sheetCard').scrollTop = 0;
  $('#modal').classList.add('on');
  document.body.style.overflow='hidden';
  // Своя запись в истории: на Android системная кнопка «назад» закрывает карточку,
  // а не выкидывает из приложения целиком.
  if(!(history.state||{}).rec){ try{ history.pushState({rec:1},''); }catch(e){} }
  $('#clsRec').onclick = ()=>closeRecipe();
}
function closeRecipe(fromPop){
  if(!$('#modal').classList.contains('on')) return;
  $('#modal').classList.remove('on');
  document.body.style.overflow='';
  if(!fromPop && (history.state||{}).rec){ try{ history.back(); }catch(e){} }
}
addEventListener('popstate', ()=>closeRecipe(true));
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeRecipe(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeRecipe(); });

/* ---------- справочник ---------- */
const match = (r,f) => !f ||
  (r.name+' '+r.ing.map(x=>x[0]).join(' ')+' '+r.gar.map(x=>x[0]).join(' ')+' '+r.glass)
    .toLowerCase().includes(f);

/* Состав прямо в строке списка: с телефона нужно видеть граммовки, не открывая карточку.
   Украшения идут следом и приглушены, чтобы не путались с основным составом. */
function compHTML(r){
  const row = ([n,a],g) =>
    `<dt class="${g?'g':''}">${n}</dt><dd class="${g?'g':''}">${a||'—'}</dd>`;
  return `<dl class="comp">${r.ing.map(x=>row(x,0)).join('')}${r.gar.map(x=>row(x,1)).join('')}</dl>`;
}

function rowHTML(r,i){
  return `<button class="rrow" data-r="${i}">
    <div class="h">${r.img?`<img src="${src(r.img)}">`:'<div style="width:38px"></div>'}
      <div class="t"><b>${r.name}</b><span>${[r.tech,r.glass].filter(Boolean).join(' · ')}</span></div>
      <div class="v">${r.total||''}</div></div>
    ${compHTML(r)}</button>`;
}

function renderRef(filter){
  const f = (filter||'').trim().toLowerCase();
  const all = REC.recipes.map((r,i)=>[r,i]).filter(([r])=>match(r,f));
  let html;
  if(REF_SORT==='src'){          // порядок исходной таблицы: лист и строка Excel
    html = (REC.sheets||[]).map(sh=>{
      const rows = all.filter(([r])=>r.sh===sh).sort((a,b)=>a[0].si-b[0].si);
      if(!rows.length) return '';
      return `<div class="chgroup"><i style="background:var(--ink-3)"></i>${sh}</div>`+
        rows.map(([r,i])=>rowHTML(r,i)).join('');
    }).join('');
  } else {                       // порядок глав пособия
    html = REC.chapters.map(ch=>{
      const rows = all.filter(([r])=>r.ch===ch.id);
      if(!rows.length) return '';
      return `<div class="chgroup"><i style="background:${ch.color}"></i>${ch.title}</div>`+
        rows.map(([r,i])=>rowHTML(r,i)).join('');
    }).join('');
  }
  $('#refList').innerHTML = html || '<div class="empty">Ничего не нашлось</div>';
  $('#cheats').classList.toggle('hidden', !!f);
}

function openRef(){
  $('#refSize').textContent = REC.recipes.length+' рецептов';
  // Шпаргалки свёрнуты в одну строку: раскрытые, они занимали весь первый экран,
  // и до составов коктейлей приходилось листать.
  $('#cheats').innerHTML =
    '<details class="cheatbox"><summary>Шпаргалки по системе</summary><div>'+CHEATS+'</div></details>';
  $('#refSort').querySelectorAll('button').forEach(b=>
    b.classList.toggle('on', b.dataset.sort===REF_SORT));
  renderRef($('#refQ').value);
  show('ref');
  $('#refQ').oninput = e=>renderRef(e.target.value);
}

$('#refSort').addEventListener('click', e=>{
  const b = e.target.closest('button[data-sort]'); if(!b) return;
  REF_SORT = b.dataset.sort;
  store.refSort = REF_SORT; save();          // выбор порядка переживает перезагрузку
  $('#refSort').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  renderRef($('#refQ').value);
  $('#refList').scrollIntoView({block:'start'});
});

/* ---------- ошибки ---------- */
function openErrors(){
  const ids = Object.keys(store.errors).filter(id=>BY_ID[id]);
  $('#errLead').textContent = ids.length
    ? 'Здесь остаются вопросы, где вы ошиблись. Ответите верно — вопрос уйдёт из списка.'
    : 'Пока пусто. Ошибки будут появляться здесь автоматически.';
  $('#errActions').innerHTML = ids.length
    ? '<button class="go" id="redo">Перерешать · '+ids.length+'</button><button class="ghostbtn" id="clear">Очистить</button>'
    : '<button class="ghostbtn" id="home2">На главную</button>';
  $('#errList').innerHTML = ids.map(id=>{
    const q=BY_ID[id];
    return `<button class="item" data-r="${q.r??''}">${q.img?`<img src="${src(q.img)}">`:''}
      <div class="txt"><b>${qLabel(q)}</b><span>${q.drink}</span></div>
      <div style="text-align:right"><div class="ans">${answerText(q)}</div>
      <div class="cnt">×${store.errors[id]}</div></div></button>`;
  }).join('');
  show('errors');
  if(ids.length){
    $('#redo').onclick = ()=>start('errors');
    $('#clear').onclick = ()=>{ store.errors={}; save(); openErrors(); };
  } else $('#home2').onclick = renderHome;
}

/* ---------- события ---------- */
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  const m=b.dataset.mode;
  if(m==='errors') openErrors(); else if(m==='ref') openRef(); else start(m);
}));
document.addEventListener('click', e=>{
  const row = e.target.closest('.rrow, .item, #showRec');
  if(!row) return;
  const i = row.dataset.r;
  if(i!=='' && i!=null) openRecipe(+i);
});
$('#back').addEventListener('click',()=>{ clearInterval(tick); closeRecipe(); renderHome(); });
// «‹» в шапке справочника и списка ошибок — возврат на главный экран
document.addEventListener('click', e=>{
  if(e.target.closest('.scrhead .back')){ closeRecipe(); renderHome(); }
});
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hidden')) return;
  if(S && S.armed && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); return; }
  const opts=$('#quiz').querySelectorAll('.opt');
  if(opts.length && /^[1-4]$/.test(e.key)){ const b=opts[+e.key-1]; if(b&&!b.disabled) b.click(); }
});
renderHome();
</script>
<script>if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));}</script>
</body>
</html>
